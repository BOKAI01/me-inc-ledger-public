name: Diagnose Cloudflare
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - run: |
          echo "token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "account length: ${#CLOUDFLARE_ACCOUNT_ID}"
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | head -c 600
          echo
          WRANGLER_LOG=debug npx -y wrangler@4 whoami 2>&1 | tail -20 || true
