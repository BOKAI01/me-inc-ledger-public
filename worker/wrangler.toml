name = "me-inc-ledger-public"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 機密值一律在 Cloudflare 後台設為「機密」（部署不會清掉）：
#   LINE_CHANNEL_SECRET、LINE_CHANNEL_ACCESS_TOKEN、GOOGLE_CLIENT_SECRET、TOKEN_ENC_KEY

# 公開設定（非機密）
[vars]
GOOGLE_CLIENT_ID = "430775966110-7kgfogemme49o7soq35ldflfhicm4p74.apps.googleusercontent.com"
LINE_BASIC_ID = "@353ktrhx"   # 公開版 LINE 官方帳號
SITE_URL = "https://bokai01.github.io/me-inc-ledger-public/"
CONTACT_EMAIL = "ss107419062@gmail.com"
# 分帳網頁（LIFF）：在 LINE Login 頻道建立 LIFF 後填入
LIFF_ID = "2011943819-wRnnwyq5"
LINE_LOGIN_CHANNEL_ID = "2011943819"
# 帳本網站（LIFF，端點為 SITE_URL）：網站用 LINE 身分登入
SITE_LIFF_ID = "2011943819-qYFtgT7i"

[observability]
enabled = true

# KV 由部署流程自動建立並填入 id（見 .github/workflows/worker.yml）
[[kv_namespaces]]
binding = "KV"
id = "__KV_ID__"

[[durable_objects.bindings]]
name = "ENTRY"
class_name = "Entry"

# 每個群組分帳區一個 Durable Object
[[durable_objects.bindings]]
name = "SPLIT"
class_name = "Split"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Entry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Split"]
