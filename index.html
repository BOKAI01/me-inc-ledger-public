<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="referrer" content="no-referrer" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Me, Inc. 個人營運帳本</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Me, Inc.">
<meta name="theme-color" content="#1F3A2E">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

<style>
:root{
  --ink:#1F3A2E; --ink-2:#7A5A2C; --gold:#A87B3D; --red:#A0421C;
  --bg:#F5F1EA; --panel:#FAF7F2; --line:#E7E2D6; --line-2:#D6D3CA;
  --t1:#3F3B35; --t2:#78716C; --t3:#A8A29E;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--sans)}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overscroll-behavior-y:contain;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input{font-family:inherit;font-size:16px}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
svg{display:block}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* layout */
.app{min-height:100vh;padding-bottom:96px}
.main{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* card */
.card{background:#fff;border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.card-hd{padding:10px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-hd.tinted{background:var(--panel)}
.card-bd{padding:16px 20px}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.lbl{font-size:10px;letter-spacing:.08em;color:var(--t2)}
.sub{font-size:11px;color:var(--t3)}
.divider-t{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line-2)}
.hdr-in{padding:14px 16px 12px;max-width:640px;margin:0 auto}
.brand{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--t2);font-weight:600}
.h1{font-size:19px;font-weight:700;color:var(--ink);margin:0}
.iconbtn{padding:9px;border-radius:3px}
.iconbtn:active{background:#0000000d}
.periodbtn{display:flex;align-items:center;gap:6px;padding:8px 10px;background:#fff;border:1px solid var(--line-2);border-radius:3px}
.periodbtn:active{transform:scale(.97)}
.periodbtn .rng{font-size:13px;font-weight:700;color:var(--ink);font-family:var(--mono);font-variant-numeric:tabular-nums}

/* P&L */
.big{font-size:30px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:3px}
.kpi{font-size:17px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi-s{font-size:14px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums}

/* dept bars */
.deptrow{display:block;width:100%;text-align:left;padding:6px 8px;margin:0 -8px;border-radius:3px}
.deptrow:active{background:#00000008}
.bar{height:6px;background:#F0EDE6;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}

/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 4px;margin:0 -16px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 12px;font-size:12px;border-radius:3px;background:#fff;border:1px solid var(--line-2);color:var(--t2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* tx list */
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 16px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:none}
.tx:active{background:#00000008}
.tx-ic{width:36px;height:36px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.tx-nm{font-size:14px;font-weight:500;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-mt{font-size:11px;color:var(--t3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-am{font-size:14px;font-weight:600;font-family:var(--mono);font-variant-numeric:tabular-nums;flex:0 0 auto}

/* fab */
.fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(31,58,46,.35);z-index:40}
.fab:active{transform:scale(.95)}

/* sheet */
.mask{position:fixed;inset:0;background:#0006;z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;max-height:92vh;overflow-y:auto;animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom)}
.grab{width:44px;height:4px;background:var(--line-2);border-radius:99px;margin:10px auto 6px}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--line-2)}
.sheet-hd h3{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.sheet-bd{padding:20px;display:flex;flex-direction:column;gap:16px}
.sheet-ft{display:flex;gap:8px;padding:16px 20px;border-top:1px solid var(--line-2)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}

/* form */
.inp{width:100%;padding:11px 12px;border:1px solid var(--line-2);border-radius:3px;font-size:16px;background:#fff}
.inp:focus{outline:none;border-color:var(--t2)}
.inp.big{font-size:24px;font-weight:600;font-family:var(--mono)}
.opt{padding:12px 6px;border:1px solid var(--line);border-radius:3px;background:#FAFAF8;text-align:center}
.opt .em{font-size:20px;line-height:1.2}
.opt .nm{font-size:11px;font-weight:500;margin-top:3px}
.opt.on{color:#fff;border-color:transparent}
.btn{padding:12px 16px;border-radius:3px;font-size:14px;font-weight:500;text-align:center}
.btn-p{background:var(--ink);color:#fff;flex:1}
.btn-p:disabled{opacity:.5}
.btn-g{border:1px solid var(--line-2);color:var(--t2);flex:1}
.btn-d{color:#B91C1C;padding:12px 14px}
.seg{padding:12px;border:1px solid var(--line-2);border-radius:3px;font-size:14px;text-align:center;color:var(--t2)}
.seg.on{color:#fff;border-color:transparent}

/* toast */
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:16px;right:16px;z-index:60;padding:12px 16px;border-radius:3px;font-size:14px;text-align:center;box-shadow:0 6px 20px #0002;animation:fade .15s ease-out}

.tag{display:inline-block;margin-left:6px;font-size:10px;padding:1px 5px;border:1px solid;border-radius:3px;vertical-align:1px}

/* status */
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:3px;font-size:12px;background:#FFF8E8;border:1px solid #F0DFB5;color:#7A5A2C}
.statusbar .spin{margin-right:6px;display:inline-block;vertical-align:-2px}
.statusbar.err-bar{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.retry{font-size:12px;font-weight:600;padding:5px 12px;border:1px solid currentColor;border-radius:3px;flex:0 0 auto}

/* boot */
.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:14px;gap:8px}
.note{font-size:11px;line-height:1.6;color:var(--t2)}
.mini{font-size:10px;color:var(--t3);margin-top:3px}
.box{padding:14px;border-radius:3px;border:1px solid var(--line-2);background:#fff}
.box-w{border:2px solid var(--gold);background:#FFFBF3}
.err{font-size:12px;color:#B91C1C;background:#FEF2F2;border:1px solid #FECACA;border-radius:3px;padding:10px}
.code{font-size:10px;font-family:var(--mono);word-break:break-all;background:#F5F4F1;padding:10px;border-radius:3px;color:var(--t2)}

/* 頁面切換（總覽／口袋） */
.navseg{display:flex;gap:4px;padding:4px;background:#ECE6DA;border-radius:999px;flex:0 0 auto}
.navseg button{height:36px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:500;color:#5A544D}
.navseg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(31,58,46,.12)}
.periodbtn .hist{font-size:10px;font-weight:700;color:#7A5A2C;background:#FFF3DC;padding:1px 6px;border-radius:99px}

/* 口袋 */
.num{font-variant-numeric:tabular-nums}
.rcard{background:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(31,58,46,.06)}
.rcard.over{background:#FFFBF9;border:1px solid #F0CDBF;box-shadow:none}
.pk-hd{display:flex;align-items:center;gap:12px}
.pk-ic{flex:0 0 auto;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px}
.pk-nm{margin:0;font-size:16px;font-weight:700;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-sub{font-size:12px;color:#6B645D;margin-top:2px}
.pk-bal{flex:0 0 auto;font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pk-bal.neg,.neg{color:var(--red)}
.overtag{display:inline-block;font-size:11px;font-weight:700;color:#8C3417;background:#FBE6DE;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pk-prog{display:flex;flex-direction:column;gap:6px}
.pk-prog .lab{display:flex;justify-content:space-between;font-size:12px;color:#5A544D}
.pk-prog .msg{font-size:12px;color:#6B645D}
.pk-prog .msg.warn{color:#8C3417}
.pbar{height:8px;background:#EFEADF;border-radius:999px;overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:999px}
.pk-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pk-stat{background:#F7F4EE;border-radius:12px;padding:10px 12px}
.rcard.over .pk-stat{background:#F7F2EC}
.pk-stat .k{font-size:12px;color:#6B645D}
.pk-stat .v{font-size:15px;font-weight:700;color:var(--t1);margin-top:2px;font-variant-numeric:tabular-nums}
.pk-acts{display:flex;gap:8px}
.pk-btn{height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:500}
.pk-btn.pri{flex:1;background:var(--ink);color:#fff}
.pk-btn.sec{border:1px solid #E3DDD0;color:var(--ink);background:#fff}
.pk-btn.sec.grow{flex:1}
.pk-btn.sec.fix{flex:0 0 96px}
.pk-btn:active,.pk-add:active,.f-btn:active{transform:scale(.98)}
.stack{display:flex;gap:3px;height:10px}
.stack>i{display:block;height:100%;border-radius:3px;min-width:4px}
.stack>i:first-child{border-top-left-radius:999px;border-bottom-left-radius:999px}
.stack>i:last-child{border-top-right-radius:999px;border-bottom-right-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#5A544D}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:99px}
.legend .o{color:#8C3417}
.legend .o i{border:1.5px solid var(--red);background:transparent}
.intro{display:flex;align-items:flex-start;gap:12px;padding:14px 4px 14px 14px;background:#E6EEE4;border-radius:16px}
.intro .ico{flex:0 0 auto;width:32px;height:32px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.intro p{margin:5px 0 0;flex:1;font-size:13.5px;line-height:1.7;color:var(--ink)}
.intro .x{flex:0 0 auto;width:44px;height:44px;margin-top:-6px;display:flex;align-items:center;justify-content:center;color:#3F5A4C}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 0}
.sec-hd h2{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.sec-hd span{font-size:12px;color:#6B645D}
.pk-add{width:100%;height:60px;border:1.5px dashed #C9BFAD;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--ink)}
.pk-add b{font-size:15px}
.pk-add small{font-size:12px;color:#6B645D}
.pk-full{padding:14px;border-radius:18px;background:#EFEADF;font-size:13px;line-height:1.6;color:#5A544D;text-align:center}
.pk-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pk-list li{display:flex;align-items:center;gap:10px;min-height:42px;padding:4px 0;border-bottom:1px solid #F0EBE1;font-size:14px}
.pk-list li:last-child{border-bottom:none}
.pk-list .dot{flex:0 0 auto;width:8px;height:8px;border-radius:99px}
.pk-list .nm{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pk-list .nm small{font-size:12px;color:#6B645D}
.pk-list b{font-variant-numeric:tabular-nums;color:var(--ink)}
.pk-more{height:44px;border-radius:12px;background:#EEF2EC;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;color:var(--ink)}

/* 口袋面板（撥款、管理、新增、刪除） */
.psheet{border-radius:24px 24px 0 0}
.psheet-in{padding:6px 20px 22px;display:flex;flex-direction:column;gap:16px}
.ps-hd{display:flex;align-items:center;gap:12px}
.ps-hd h2{margin:0;font-size:19px;font-weight:700;color:var(--ink)}
.ps-hd .sub2{font-size:12px;color:#6B645D;margin-top:2px}
.ps-x{width:44px;height:44px;margin-right:-10px;display:flex;align-items:center;justify-content:center;color:#6B645D;flex:0 0 auto}
.f-row{display:flex;flex-direction:column;gap:6px}
.f-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:500;color:#3F3B35}
.f-lbl small{font-size:12px;font-weight:400;color:#6B645D}
.f-inp{width:100%;height:48px;padding:0 14px;border:1px solid #D9D2C4;border-radius:12px;font-size:16px;background:#fff}
.f-inp:focus{outline:2px solid var(--ink);outline-offset:1px}
.f-money{display:flex;align-items:center;gap:6px;height:48px;padding:0 14px;border:1px solid #D9D2C4;border-radius:12px;background:#fff}
.f-money:focus-within{outline:2px solid var(--ink);outline-offset:1px}
.f-money span{font-size:16px;color:#6B645D}
.f-money input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px;font-variant-numeric:tabular-nums}
.f-money.big{height:58px;border:1.5px solid var(--ink)}
.f-money.big span{font-size:22px;font-weight:700}
.f-money.big input{font-size:26px;font-weight:700;color:var(--ink)}
.f-hint{font-size:12px;line-height:1.6;color:#6B645D}
.f-err{font-size:12px;line-height:1.6;color:#B91C1C}
.f-acts{display:flex;gap:8px}
.f-btn{height:50px;border-radius:14px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.f-btn.pri{flex:1;background:var(--ink);color:#fff;font-weight:700}
.f-btn.sec{flex:0 0 104px;border:1px solid #E3DDD0;color:#5A544D}
.f-btn.dan{flex:1;background:#9B2C12;color:#fff;font-weight:700}
.f-btn.out{width:100%;height:48px;border:1px solid #E8C4B6;color:#9B2C12;font-weight:500}
.f-btn:disabled{opacity:.45}
.dseg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;background:#F1ECE2;border-radius:14px}
.dseg button{height:44px;border-radius:11px;font-size:14px;color:#5A544D;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.dseg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(31,58,46,.14)}
.ft{display:flex;align-items:center;gap:8px}
.ft>div{flex:1;min-width:0;padding:12px;border-radius:14px;background:#F7F4EE}
.ft .k{font-size:12px;color:#6B645D}
.ft .n{font-size:15px;font-weight:700;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft .b{font-size:12px;color:#5A544D;margin-top:2px;font-variant-numeric:tabular-nums}
.ft .arr{flex:0 0 auto;width:32px;height:32px;padding:0;border-radius:99px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
.qchips{display:flex;gap:8px;flex-wrap:wrap}
.qchip{height:36px;padding:0 14px;border-radius:999px;border:1px solid #E3DDD0;background:#fff;font-size:13px;color:var(--ink)}
.qchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.after{padding:12px 14px;border-radius:14px;background:#EEF2EC;display:flex;flex-direction:column;gap:8px}
.after .t{font-size:12px;font-weight:700;color:var(--ink)}
.after .r{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.after .r b{font-variant-numeric:tabular-nums;color:var(--ink)}
.after .r b small{font-weight:500;font-size:12px;color:#5A544D}
.after .w{font-size:12px;line-height:1.6;color:#8C3417}
.f-2col{display:flex;gap:10px}
.f-2col>.f-row:first-child{flex:0 0 140px}
.f-2col>.f-row:last-child{flex:1;min-width:0}
.icgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.icgrid button{height:48px;border-radius:12px;border:1px solid #E8E2D6;background:#FAF8F4;font-size:22px}
.icgrid button.on{border:2px solid var(--ink);background:#EEF2EC}
.dlg-mask{position:fixed;inset:0;background:rgba(24,30,26,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s ease-out}
.dlg{background:#fff;border-radius:22px;padding:22px 20px 20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
.dlg h2{margin:0;font-size:18px;font-weight:700;color:var(--t1);line-height:1.4}
.dlg .bal{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:#FDF3EF;font-size:13px;color:#5A544D}
.dlg .bal b{font-size:20px;font-variant-numeric:tabular-nums}
.dlg ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.dlg li{display:flex;gap:10px;font-size:13.5px;line-height:1.6;color:#3F3B35}
.dlg li>span:first-child{flex:0 0 auto;width:22px;height:22px;border-radius:99px;background:#F1ECE2;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
</style>
</head>
<body>
<div id="root"><div class="boot">載入中⋯</div></div>
<script>
/* 網站設定：帳本後台與 LINE 登入（LIFF）。網址裡不再帶任何金鑰 */
window.MEINC = { api: 'https://me-inc-ledger-public.ss107419062.workers.dev', liffId: '2011943819-qYFtgT7i', basicId: '@353ktrhx' };
try{
  /* 舊版連結的 #api=…（含金鑰）已停用：立刻從網址與瀏覽器紀錄清掉，也刪除舊的保存 */
  if (/(^#|&)api=/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
  localStorage.removeItem('meinc_api_url');
}catch(e){}
try{
  var s = localStorage.getItem('meinc_session');
  var q = localStorage.getItem('meinc_offline_queue');
  if (s && (!q || q === '[]')) {
    var fd = new FormData(); fd.append('payload', '{"action":"load"}');
    var ctl = new AbortController();
    setTimeout(function(){ ctl.abort(); }, 25000);
    window.__boot = fetch(window.MEINC.api + '/api', { method:'POST', body:fd, headers:{ Authorization:'Bearer ' + s }, signal:ctl.signal })
      .then(function(r){ return r.json(); }).catch(function(){ return null; });
  }
}catch(e){}
</script>
